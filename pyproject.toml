[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/knee_mri"]

[project]
name = "knee-mri"
version = "0.1.0"
description = "Personal entry for the Kaggle RSNA Knee Abnormality Detection competition"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4,<1.10",
    "iterative-stratification==0.1.9",
    "pydicom>=2.4,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.8",
]
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
kaggle = [
    "kaggle>=1.6",
]
dicom-extra = [
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.0",
]
torch = [
    "torch>=2.9.1",
    "transformers>=4.45",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "C4", "B", "A001", "RUF", "TID"]

[tool.ruff.format]
docstring-code-format = true
